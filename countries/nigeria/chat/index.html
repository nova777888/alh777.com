<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1c2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nova Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <div class="card">
    <h2>🔐 Nova Chat</h2>
    <p>Login with your Telegram username to chat</p>
    <div class="input-group">
      <label>Telegram Username</label>
      <input type="text" id="tgUsername" placeholder="@username or username" autocomplete="username">
    </div>
    <button class="btn-primary" id="loginBtn">Login</button>
    <div class="error-msg" id="loginError"></div>
  </div>
</div>

<!-- Chat Screen -->
<div id="chatScreen" class="chat-screen">
  <div class="header">
    <button class="back" id="backBtn">←</button>
    <span class="logo">Nova</span>
    <span style="margin-left:auto;font-size:13px;opacity:.7" id="currentUser"></span>
  </div>
  
  <div id="emptyState" class="empty-state">
    <div>
      <div style="font-size:48px;margin-bottom:16px">💬</div>
      <div>Welcome to Nova Chat</div>
      <div style="font-size:13px;margin-top:8px;opacity:.7">Send photos and videos directly</div>
    </div>
  </div>
  
  <div id="messagesContainer" class="messages" style="display:none"></div>
  
  <div class="typing-indicator" id="typingIndicator"></div>
  
  <div class="input-bar">
    <button class="media-btn" id="mediaBtn" title="Attach photo/video">📎</button>
    <input type="file" id="fileInput" class="upload-input" accept="image/*,video/*">
    <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" disabled>➤</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
